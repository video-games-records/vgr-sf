services:
    _defaults:
        autowire: true
        autoconfigure: true

    # Forum Services
    App\SharedKernel\:
        resource: '../../src/SharedKernel/*'

    # Event Dispatcher
    App\SharedKernel\Domain\Interface\EventDispatcherInterface:
        alias: App\SharedKernel\Infrastructure\Event\SymfonyEventDispatcher

    # Discord Monolog Handler
    App\SharedKernel\Infrastructure\Monolog\DiscordHandler:
        arguments:
            $webhookUrl: '%env(DISCORD_WEBHOOK_URL)%'
        tags:
            - { name: monolog.logger }




