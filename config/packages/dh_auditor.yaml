# Full configuration reference available at:
# https://damienharper.github.io/auditor-docs/docs/auditor-bundle/configuration/reference.html
dh_auditor:
    enabled: false
    providers:
        doctrine:
            table_prefix: null
            table_suffix: '_audit'
            ignored_columns:
                - createdAt
                - updatedAt
                - slug
            entities:
                App\BoundedContext\User\Domain\Entity\User:
                    ignored_columns:
                        - password
                        - lastLogin
                        - confirmationToken
                        - passwordRequestedAt
                        - nbConnexion
                        - nbForumMessage
                        - extraData
                        - avatar
                App\BoundedContext\VideoGamesRecords\Core\Domain\Entity\Game:
                    ignored_columns:
                        - nbChart
                        - nbPost
                        - nbPlayer
                        - nbVideo
                        - nbTeam
                        - forum
                        - lastUpdate
                        - lastScore
                        - picture
                        - isRank
                App\BoundedContext\VideoGamesRecords\Core\Domain\Entity\Platform:
                    ignored_columns:
                        - picture
                App\BoundedContext\VideoGamesRecords\Core\Domain\Entity\Serie:
                    ignored_columns:
                        - nbChart
                        - nbGame
                        - nbPlayer
                        - nbTeam
                        - nbPost
                        - picture
                App\BoundedContext\VideoGamesRecords\Core\Domain\Entity\Rule:
                App\BoundedContext\VideoGamesRecords\Core\Domain\Entity\ChartType:
                App\BoundedContext\VideoGamesRecords\Core\Domain\Entity\Player:
                    ignored_columns:
                        - avatar
                        - lastLogin
                        - lastDisplayLostPosition
                        - presentation
                        - collection
                        # Computed stats / rankings (recalculated by background jobs, not meaningful changes)
                        - nbConnexion
                        - nbChart
                        - nbChartProven
                        - nbChartMax
                        - nbChartWithPlatform
                        - nbChartDisabled
                        - nbGame
                        - nbVideo
                        - nbMasterBadge
                        - rankProof
                        - rankCountry
                        - rankCup
                        - rankMedal
                        - rankBadge
                        - rankPointChart
                        - rankPointGame
                        - pointChart
                        - pointGame
                        - pointBadge
                        - averageChartRank
                        - averageGameRank
                        - chartRank0
                        - chartRank1
                        - chartRank2
                        - chartRank3
                        - chartRank4
                        - chartRank5
                        - gameRank0
                        - gameRank1
                        - gameRank2
                        - gameRank3

            storage_services:
                - '@doctrine.orm.audit_entity_manager'
            auditing_services:
                - '@doctrine.orm.default_entity_manager'
            viewer: true
