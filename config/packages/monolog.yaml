monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists

when@dev:
    monolog:
        handlers:
            main:
                type: rotating_file
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                max_files: 7
                channels: [ "!event", "!doctrine", "!deprecation" ]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]
            doctrine:
                type: rotating_file
                path: "%kernel.logs_dir%/doctrine.log"
                max_files: 7
                channels: [ doctrine ]
            deprecation:
                type: rotating_file
                path: "%kernel.logs_dir%/deprecation.log"
                max_files: 7
                channels: [ deprecation ]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: rotating_file
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: error
                max_files: 30
                channels: ["!deprecation"]
            discord:
                type: service
                id: App\SharedKernel\Infrastructure\Monolog\DiscordHandler
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
